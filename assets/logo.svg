<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f9488"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- faint DNS record lines -->
  <g stroke="#1f2b45" stroke-width="6" stroke-linecap="round">
    <line x1="56" y1="120" x2="104" y2="120"/>
    <line x1="56" y1="150" x2="92" y2="150"/>
    <line x1="56" y1="180" x2="110" y2="180"/>
    <line x1="408" y1="330" x2="456" y2="330"/>
    <line x1="420" y1="360" x2="456" y2="360"/>
    <line x1="402" y1="390" x2="456" y2="390"/>
  </g>

  <!-- shield -->
  <path d="M256 72 L404 124 V246 C404 344 340 414 256 448 C172 414 108 344 108 246 V124 Z"
        fill="#0d1526" stroke="url(#shield)" stroke-width="16" stroke-linejoin="round"/>

  <!-- envelope -->
  <rect x="164" y="170" width="184" height="128" rx="18" fill="#e2e8f0"/>
  <path d="M170 182 L256 246 L342 182" fill="none" stroke="#94a3b8" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- heartbeat line -->
  <polyline points="132,334 200,334 222,334 238,304 256,366 274,318 288,334 380,334"
            fill="none" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"
            stroke-linejoin="round" filter="url(#glow)" opacity="0.8"/>
  <polyline points="132,334 200,334 222,334 238,304 256,366 274,318 288,334 380,334"
            fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"
            stroke-linejoin="round"/>

  <!-- check badge -->
  <circle cx="344" cy="176" r="34" fill="#2dd4bf" stroke="#0d1526" stroke-width="8"/>
  <path d="M328 177 L340 189 L361 166" fill="none" stroke="#0d1526" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
